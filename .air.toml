root = "."
tmp_dir = "tmp"

[build]
  cmd = "go build -o ./tmp/loft.exe ./cmd/server"
  entrypoint = "./tmp/loft.exe"
  include_ext = ["go", "tpl", "tmpl", "html"]
  exclude_dir = ["tmp", "vendor", "migrations"]
  exclude_regex = ["_test.go"]
  delay = 500
  stop_on_error = true
  send_interrupt = true
  kill_delay = 500

[log]
  time = true

[color]
  main = "magenta"
  watcher = "cyan"
  build = "yellow"
  runner = "green"
