global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: mingly-api
    metrics_path: /metrics
    scheme: "${MINGLY_METRICS_SCHEME}"
    static_configs:
      # Use a private Docker/Kubernetes DNS name or a protected public URL.
      - targets: ["${MINGLY_METRICS_TARGET}"]
        labels:
          service: mingly-api
          environment: "${APP_ENV}"

remote_write:
  - url: "https://${BETTER_STACK_INGESTING_HOST}/metrics"
    authorization:
      type: Bearer
      credentials: "${BETTER_STACK_METRICS_SOURCE_TOKEN}"
